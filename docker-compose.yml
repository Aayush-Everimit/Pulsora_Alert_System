services:
  # 🐘 PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: pulsora_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aayush@2006
      POSTGRES_DB: pulsora_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 💡 Spring Boot Backend
  backend:
    build:
      context: ./Pulsora
      dockerfile: Dockerfile
    container_name: pulsora_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pulsora_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Aayush@2006
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    # ✅ Keeps maven dependencies cached between builds
    volumes:
      - ~/.m2:/root/.m2
    # ✅ Ensures we run the built JAR instead of source overwriting
    command: ["java", "-jar", "app.jar"]

  # 🖥️ React/Vite Frontend
  frontend:
    build:
      context: ./PulsoraClient
      dockerfile: Dockerfile
    container_name: pulsora_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5175:5175"
    working_dir: /app/pulsoraClient
    volumes:
      - ./PulsoraClient/pulsoraClient:/app/pulsoraClient
      - /app/pulsoraClient/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080

  # 📬 MailHog - email testing UI
  mailhog:
    image: mailhog/mailhog
    container_name: pulsora_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # 🧠 pgAdmin - PostgreSQL Management UI
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pulsora_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pulsora.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:
